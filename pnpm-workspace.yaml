packages:
  - api
  - client
  - packages/*
  - plugins/*

overrides:
  qs: ^6.16.0
  ip: file:vendor/ip

peerDependencyRules:
  allowedVersions:
    mongoose: '>=6'

allowBuilds:
  bcrypt: true
  bufferutil: true
  core-js: true
  es5-ext: true
  unrs-resolver: true
  utf-8-validate: true
minimumReleaseAgeExclude:
  - '@types/node@26.5.0'
  - lucide-react@1.42.0
